# Local development stack: PostgreSQL 16 + CycleCare API.
#   cp backend/.env.example backend/.env   # then set JWT_SECRET, GROK_API_KEY
#   docker compose up --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cyclecare
      POSTGRES_PASSWORD: cyclecare
      POSTGRES_DB: cyclecare
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cyclecare"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://cyclecare:cyclecare@db:5432/cyclecare
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
