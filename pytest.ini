[pytest]
# اختبارات الوحدة فقط. smoke_test.py يشغّل طلبات HTTP فعلية عند الاستيراد
# فتُستبعد من الجمع التلقائي. لتشغيله يدويًا بعد تشغيل الخادم:
#   python smoke_test.py
testpaths = tests
python_files = test_*.py
addopts = -q
markers =
    postgres: يحتاج PostgreSQL+pgvector (TEST_DATABASE_URL أو الحزمة pgserver)
