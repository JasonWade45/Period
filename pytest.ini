[pytest]
# اختبارات الوحدة فقط. smoke_test.py يشغّل طلبات HTTP فعلية عند الاستيراد
# فتُستبعد من الجمع التلقائي. لتشغيله يدويًا بعد تشغيل الخادم:
#   python smoke_test.py
testpaths = tests
python_files = test_*.py
addopts = -q
filterwarnings =
    # FastAPI يبني TypeAdapter مستقلًا لحقول نموذج الجسم، وpydantic تحذّر أن
    # validation_alias بلا أثر في ذلك السياق المساعد. الاسم القديم length_days
    # يُقبل فعليًا عبر model_validate للنموذج نفسه — مثبتًا في
    # tests/test_data_model.py (لا نحذف التوافق لكتم تحذير).
    ignore:The 'validation_alias' attribute with value .*:pydantic.warnings.UnsupportedFieldAttributeWarning
